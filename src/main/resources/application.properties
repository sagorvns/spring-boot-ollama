# Spring Boot Application Configuration
spring.application.name=spring-boot-ollama
# Server Configuration
server.port=8080
# Ollama API Configuration
ollama.api.url=http://localhost:11434/api/generate
ollama.api.model=deepseek-r1:1.5b
# HTTP Client Configuration (for RestTemplate/WebClient)
# Connection timeout in milliseconds (30 seconds)
spring.http.client.connect-timeout=30000
# Read timeout in milliseconds (60 seconds)
spring.http.client.read-timeout=60000
# Logging Configuration
logging.level.root=INFO
logging.level.com.example.ollama=DEBUG
# Gemini API Configuration
# Get your key from https://aistudio.google.com/
spring.ai.google.genai.api-key=AIzaSyBxgovP3RjMiUocm-iqjsQL-6VH0iJMg0I
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
# Chat Model Options (Optional)
# Controls randomness: 0.0 (factual) to 1.0 (creative)
spring.ai.google.genai.chat.options.temperature=0.7
# Maximum tokens for the response
spring.ai.google.genai.chat.options.max-output-tokens=1000
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=pgsql
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
