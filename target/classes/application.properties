# Spring Boot Application Configuration
spring.application.name=spring-boot-ollama

# Server Configuration
server.port=8080

# Ollama API Configuration
ollama.api.url=http://localhost:11434/api/generate
ollama.api.model=deepseek-r1:1.5b

# HTTP Client Configuration (for RestTemplate/WebClient)
# Connection timeout in milliseconds (30 seconds)
spring.http.client.connect-timeout=30000
# Read timeout in milliseconds (60 seconds)
spring.http.client.read-timeout=60000

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.ollama=DEBUG
